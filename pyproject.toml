[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctf-copilot"
version = "0.1.0"
description = "A local-first CLI assistant for CTF players and pentesters: parses nmap/gobuster/nikto/etc. output and suggests concrete next enumeration steps."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hugo Arribas Munoz" }]
requires-python = ">=3.9"
keywords = ["ctf", "pentesting", "recon", "security-tools", "cli", "nmap", "enumeration", "infosec"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=13.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
llm = ["requests>=2.28"]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/HMJ07/ctf-copilot"
Issues = "https://github.com/HMJ07/ctf-copilot/issues"

[project.scripts]
ctfc = "ctf_copilot.cli:main"
ctf-copilot = "ctf_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ctf_copilot = ["rules/data/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
